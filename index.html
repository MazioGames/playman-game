<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruba Dungeon</title>
    <style>
        :root {
            --bg-color: #2b261f;
            --card-bg: #fdf6e3;
            --text-color: #2c251e;
            --primary-color: #8b0000;
            --accent-color: #d9a05b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: #fdf6e3;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--accent-color);
            margin-bottom: 5px;
        }

        .status-bar {
            display: flex;
            gap: 15px;
            background: rgba(0,0,0,0.4);
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--accent-color);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(4, 130px);
            gap: 15px;
            background: #3e352b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }

        .slot {
            width: 130px;
            height: 180px;
            border: 2px dashed #6b5b48;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: rgba(0,0,0,0.2);
            text-align: center;
            padding: 5px;
            box-sizing: border-box;
        }

        .slot-title {
            position: absolute;
            top: 5px;
            font-size: 0.75rem;
            color: var(--accent-color);
            text-transform: uppercase;
            font-weight: bold;
        }

        .card {
            width: 110px;
            height: 150px;
            background-color: var(--card-bg);
            color: var(--text-color);
            border-radius: 6px;
            border: 2px solid #000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 8px;
            box-sizing: border-box;
            font-weight: bold;
            box-shadow: 2px 4px 8px rgba(0,0,0,0.3);
            margin-top: 15px;
        }

        .card.back {
            background: var(--primary-color);
            border-color: #fff;
            color: #fff;
            justify-content: center;
            align-items: center;
        }

        .card-val { font-size: 1.2rem; }
        .card-suit { font-size: 1rem; }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: 1px solid var(--accent-color);
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: #a71d1d;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        #log {
            margin-top: 20px;
            width: 560px;
            height: 100px;
            background: #1e1a15;
            border: 1px solid #6b5b48;
            border-radius: 5px;
            padding: 10px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
            color: #d9a05b;
        }
    </style>
</head>
<body>

    <h1>★ Ruba Dungeon ★</h1>
    
    <div class="status-bar">
        <div>Eroe HP: <span id="hero-hp">12</span>/12</div>
        <div>Modalità: <span id="mode-display">Facile</span></div>
        <div>Oro accumulato: <span id="gold-count">0</span></div>
        <div>Reliquie: <span id="relic-count">0</span>/4</div>
    </div>

    <div class="board">
        <!-- Riga 1 -->
        <div class="slot"><span class="slot-title">1. Dungeon</span><div id="deck-dungeon"></div></div>
        <div class="slot"><span class="slot-title">2. Evento</span><div id="card-event"></div></div>
        <div class="slot"><span class="slot-title">3. Personaggi</span><div id="deck-characters"></div></div>
        <div class="slot"><span class="slot-title">4. Catacomba</span><div id="slot-catacomb"></div></div>

        <!-- Riga 2 -->
        <div class="slot"><span class="slot-title">6. Reliquie</span><div id="slot-relics"></div></div>
        <div class="slot"><span class="slot-title">7. Eroe</span><div id="slot-hero"></div></div>
        <div class="slot" style="grid-column: span 2;"><span class="slot-title">5. Nemico / Azioni</span><div id="slot-enemy"></div></div>

        <!-- Riga 3 -->
        <div class="slot"><span class="slot-title">8. Oro</span><div id="slot-gold"></div></div>
        <div class="slot"><span class="slot-title">9. Aiuti</span><div id="slot-aids"></div></div>
        <div class="slot" style="grid-column: span 2;"><span class="slot-title">10. Mazzo Reliquie</span><div id="deck-relics"></div></div>
    </div>

    <div class="controls">
        <button id="btn-draw" onclick="drawEvent()">Pesca Evento (Crawling)</button>
        <button id="btn-roll" onclick="rollDiceTest()" disabled>Lancia 1D6</button>
        <button id="btn-restart" onclick="initGame()">Nuova Partita</button>
    </div>

    <div id="log">Benvenuto in Ruba Dungeon! Clicca "Pesca Evento" per iniziare.</div>

    <script>
        const SUITS = { BASTONI: 'Bastoni', COPPE: 'Coppe', DENARI: 'Denari', SPADE: 'Spade' };
        
        let hero = { hp: 12, maxHp: 12, card: null };
        let enemy = null;
        let mode = 'Facile'; // 'Facile' o 'Difficile'
        
        let mazzoDungeon = [];
        let mazzoPersonaggi = [];
        let mazzoReliquie = [];
        
        let cartaEventoCorrente = null;
        let carteOro = 0;
        let reliquieOttenute = [];
        let carteAiuto = [];

        function log(msg) {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML += `<div>> ${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function createDeck() {
            let deck = [];
            for (let suit in SUITS) {
                for (let val = 1; val <= 10; val++) {
                    deck.push({ suit: SUITS[suit], value: val });
                }
            }
            return deck;
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function initGame() {
            document.getElementById('log').innerHTML = '';
            log('Inizio nuova partita...');

            let fullDeck = createDeck();
            shuffle(fullDeck);

            // 1. Selezione Eroe (8 o 9 casuale)
            let heroIndex = fullDeck.findIndex(c => c.value === 8 || c.value === 9);
            hero.card = fullDeck.splice(heroIndex, 1)[0];
            hero.hp = 12;

            // 2. Mazzo Personaggi (valori 8, 9, 10 rimasti)
            mazzoPersonaggi = fullDeck.filter(c => c.value >= 8 && c.value <= 10);
            fullDeck = fullDeck.filter(c => !(c.value >= 8 && c.value <= 10));

            // 3. Mazzo Reliquie (gli Assi - valore 1)
            mazzoReliquie = fullDeck.filter(c => c.value === 1);
            fullDeck = fullDeck.filter(c => c.value !== 1);

            // 4. Mazzo Dungeon (tutte le altre carte rimaste)
            mazzoDungeon = fullDeck;

            carteOro = 0;
            reliquieOttenute = [];
            carteAiuto = [];
            cartaEventoCorrente = null;

            updateUI();
            log(`Eroe scelto: ${hero.card.value} di ${hero.card.suit}`);
        }

        function updateUI() {
            document.getElementById('hero-hp').innerText = hero.hp;
            document.getElementById('gold-count').innerText = carteOro;
            document.getElementById('relic-count').innerText = reliquieOttenute.length;

            // Render Slot Eroe
            document.getElementById('slot-hero').innerHTML = renderCardHTML(hero.card);

            // Render Mazzo Dungeon
            document.getElementById('deck-dungeon').innerHTML = mazzoDungeon.length > 0 ? `<div class="card back">Dungeon (${mazzoDungeon.length})</div>` : '';

            // Render Carta Evento
            document.getElementById('card-event').innerHTML = cartaEventoCorrente ? renderCardHTML(cartaEventoCorrente) : '';

            // Render Mazzo Personaggi
            document.getElementById('deck-characters').innerHTML = mazzoPersonaggi.length > 0 ? `<div class="card back">Personaggi (${mazzoPersonaggi.length})</div>` : '';

            // Render Mazzo Reliquie
            document.getElementById('deck-relics').innerHTML = mazzoReliquie.length > 0 ? `<div class="card back">Reliquie (${mazzoReliquie.length})</div>` : '';
        }

        function renderCardHTML(card) {
            return `
                <div class="card">
                    <div class="card-val">${card.value}</div>
                    <div class="card-suit">${card.suit}</div>
                </div>
            `;
        }

        function drawEvent() {
            if (mazzoDungeon.length === 0) {
                log('Il mazzo Dungeon è finito! Rimischiamento...');
                // Gestione rimischiamento se necessario
                return;
            }

            cartaEventoCorrente = mazzoDungeon.pop();
            updateUI();
            
            log(`Pesca Evento: ${cartaEventoCorrente.value} di ${cartaEventoCorrente.suit}`);
            
            // Abilita azioni relative all'evento
            document.getElementById('btn-draw').disabled = true;
            document.getElementById('btn-roll').disabled = false;

            // Risoluzione automatica Denari (Oro) o Spade (Nemico)
            if (cartaEventoCorrente.suit === SUITS.DENARI) {
                carteOro += cartaEventoCorrente.value;
                log(`Hai guadagnato ${cartaEventoCorrente.value} Oro!`);
                endTurn();
            } else if (cartaEventoCorrente.suit === SUITS.SPADE) {
                log(`Scontro imminente! Inizia il combattimento.`);
                startCombat();
            }
        }

        function rollDiceTest() {
            let roll = Math.floor(Math.random() * 6) + 1;
            log(`Lancio del dado: ${roll}`);

            let vce = cartaEventoCorrente.value;
            let success = false;

            if (roll === 1) success = false;
            else if (roll === 6) success = true;
            else if (roll >= vce) success = true;

            if (success) {
                log('Test SUPERATO!');
                if (cartaEventoCorrente.suit === SUITS.COPPE) {
                    hero.hp = Math.min(hero.maxHp, hero.hp + vce);
                    log(`Ti sei curato di ${vce} HP!`);
                }
            } else {
                log('Test FALLITO!');
                let damage = Math.floor(vce / 2);
                if (cartaEventoCorrente.suit === SUITS.BASTONI || cartaEventoCorrente.suit === SUITS.COPPE) {
                    hero.hp -= damage;
                    log(`Subisci ${damage} danni da Trappola/Intruglio!`);
                }
            }

            if (hero.hp <= 0) {
                log('GAME OVER! L\'Eroe è stato sconfitto.');
                document.getElementById('btn-roll').disabled = true;
                return;
            }

            endTurn();
        }

        function startCombat() {
            if (mazzoPersonaggi.length === 0) return;
            enemy = mazzoPersonaggi.pop();
            
            let enemyHp = mode === 'Facile' ? 6 : (enemy.value === 8 ? 8 : enemy.value === 9 ? 9 : 10);
            log(`Appare il Nemico: ${enemy.value} di ${enemy.suit} (HP: ${enemyHp})`);
            
            document.getElementById('slot-enemy').innerHTML = renderCardHTML(enemy);
        }

        function endTurn() {
            document.getElementById('btn-draw').disabled = false;
            document.getElementById('btn-roll').disabled = true;
            updateUI();
        }

        // Avvio automatico al caricamento
        window.onload = initGame;
    </script>
</body>
</html>
