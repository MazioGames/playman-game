<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Playman Summer Games 3</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            font-family: 'Press Start 2P', monospace;
            text-align: center;
            overflow: hidden;
            user-select: none;
        }

        /* MENU PRINCIPALE */
        #menu-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, #1e3799, #0c2461);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        h1 {
            color: #ffffff;
            font-size: 20px;
            margin-bottom: 5px;
            text-shadow: 3px 3px #e74c3c;
            font-style: italic;
        }

        .subtitle {
            color: #f1c40f;
            font-size: 10px;
            margin-bottom: 25px;
        }

        input[type="text"] {
            padding: 10px;
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            border-radius: 4px;
            border: 3px solid #e74c3c;
            text-align: center;
            width: 70%;
            max-width: 220px;
            background: #fff;
            color: #000;
            margin-bottom: 20px;
        }

        .menu-btn {
            padding: 15px;
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            background: #e74c3c;
            color: white;
            border: 3px solid #fff;
            border-radius: 8px;
            box-shadow: 0 4px #c0392b;
            margin: 8px;
            width: 80%;
            max-width: 250px;
            touch-action: manipulation;
        }

        .menu-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px #c0392b;
        }

        .high-score-box {
            margin-top: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #f1c40f;
            font-size: 9px;
            color: #f1c40f;
            line-height: 1.6;
        }

        /* CANVAS AREA */
        #gameCanvas {
            display: block;
            margin: 0 auto;
            background: #000;
            border-bottom: 3px solid #444;
            max-width: 100vw;
            height: auto;
            image-rendering: pixelated;
        }

        /* CONTROLLI DI GIOCO */
        .controls {
            display: flex;
            justify-content: space-around;
            position: fixed;
            bottom: 12px;
            width: 100%;
        }

        .btn {
            width: 44%;
            height: 75px;
            font-family: 'Press Start 2P', monospace;
            font-size: 16px;
            background: linear-gradient(180deg, #3498db, #2980b9);
            color: white;
            border: 3px solid #fff;
            border-radius: 12px;
            box-shadow: 0 5px #1a5276;
            touch-action: manipulation;
        }

        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px #1a5276;
        }

        /* FINISH MODAL */
        #end-game-modal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #2c3e50;
            border: 4px solid #e74c3c;
            padding: 20px;
            border-radius: 12px;
            z-index: 20;
            width: 80%;
            max-width: 280px;
        }
    </style>
</head>
<body>

    <!-- MENU PRINCIPALE -->
    <div id="menu-overlay">
        <h1>PLAYMAN</h1>
        <div class="subtitle">SUMMER GAMES 3</div>

        <input type="text" id="playerName" placeholder="NOME" maxlength="8" value="MAZIO">

        <button class="menu-btn" onclick="startGame()">🏃 100M SPRINT</button>

        <div class="high-score-box">
            BEST RECORD:<br>
            <span id="recordDisplay">--.--s</span>
        </div>
    </div>

    <!-- CANVAS DI GIOCO -->
    <canvas id="gameCanvas" width="320" height="320"></canvas>

    <!-- TASTI DI GIOCO -->
    <div class="controls">
        <button class="btn" id="btnSX">◀ 4</button>
        <button class="btn" id="btnDX">6 ▶</button>
    </div>

    <!-- FINISH MODAL -->
    <div id="end-game-modal">
        <h2 id="endTitle" style="color: #2ecc71; font-size: 13px; margin-top:0;">GARA FINITA!</h2>
        <p id="endDetails" style="font-size: 9px; line-height: 1.6;"></p>
        <button class="menu-btn" style="width:100%; margin:5px 0;" onclick="restartGame()">RIGIOCA</button>
        <button class="menu-btn" style="width:100%; margin:5px 0; background:#7f8c8d;" onclick="showMenu()">MENU</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        let distance = 0;
        let speed = 0;
        let lastKey = '';
        let timer = 0;
        let running = false;
        let finished = false;
        let animFrame = 0;
        let totalDistance = 500;

        // Rivale BOT
        let botDist = 0;
        let botSpeed = 105;

        let playerName = "MAZIO";
        let bestRecord = localStorage.getItem('playman_best') ? parseFloat(localStorage.getItem('playman_best')) : null;
        let bestPlayer = localStorage.getItem('playman_player') || "";

        const recordDisplay = document.getElementById('recordDisplay');

        function updateRecordDisplay() {
            if (bestRecord) {
                recordDisplay.innerText = `${bestPlayer}: ${bestRecord.toFixed(2)}s`;
            } else {
                recordDisplay.innerText = "NESSUN RECORD";
            }
        }
        updateRecordDisplay();

        function startGame() {
            let inputName = document.getElementById('playerName').value.trim();
            if (inputName !== "") playerName = inputName.toUpperCase();
            
            document.getElementById('menu-overlay').style.display = 'none';
            document.getElementById('end-game-modal').style.display = 'none';

            resetVariables();
        }

        function showMenu() {
            document.getElementById('end-game-modal').style.display = 'none';
            document.getElementById('menu-overlay').style.display = 'flex';
            updateRecordDisplay();
        }

        function restartGame() {
            document.getElementById('end-game-modal').style.display = 'none';
            resetVariables();
        }

        function resetVariables() {
            distance = 0;
            speed = 0;
            lastKey = '';
            timer = 0;
            running = false;
            finished = false;
            animFrame = 0;
            botDist = 0;
            botSpeed = 95 + Math.random() * 20;
        }

        let lastTime = performance.now();
        function gameLoop(currentTime) {
            let delta = (currentTime - lastTime) / 1000;
            lastTime = currentTime;

            if (running && !finished) {
                timer += delta;

                speed = Math.max(0, speed - (55 * delta));
                distance += speed * delta;
                animFrame += speed * delta * 0.18;

                botDist += botSpeed * delta;

                if (distance >= totalDistance) {
                    finished = true;
                    handleFinish();
                }
            }

            drawScene();
            requestAnimationFrame(gameLoop);
        }

        function handleFinish() {
            let finalTime = timer.toFixed(2);
            let isNewRecord = false;

            if (!bestRecord || timer < bestRecord) {
                bestRecord = timer;
                bestPlayer = playerName;
                localStorage.setItem('playman_best', bestRecord);
                localStorage.setItem('playman_player', bestPlayer);
                isNewRecord = true;
            }

            document.getElementById('endTitle').innerText = isNewRecord ? "🏆 NUOVO RECORD!" : "GARA FINITA!";
            document.getElementById('endTitle').style.color = isNewRecord ? "#f1c40f" : "#2ecc71";
            document.getElementById('endDetails').innerText = `${playerName}\nTEMPO: ${finalTime}s`;
            document.getElementById('end-game-modal').style.display = 'block';
        }

        function drawScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. CROWD / SPALTI SULLO SFONDO
            ctx.fillStyle = '#bdc3c7';
            ctx.fillRect(0, 0, canvas.width, 25);
            for (let x = 0; x < canvas.width; x += 8) {
                let colors = ['#e74c3c', '#f1c40f', '#3498db', '#2ecc71', '#34495e'];
                ctx.fillStyle = colors[(x + Math.floor(animFrame * 2)) % colors.length];
                ctx.fillRect(x + 2, 4, 5, 8);
                ctx.fillStyle = '#ffdd59';
                ctx.fillRect(x + 2, 12, 5, 5);
            }

            // 2. ERBA VERDE (CAMPON)
            ctx.fillStyle = '#a3cb38';
            ctx.fillRect(0, 25, canvas.width, 70);

            // 3. CARTELLONI SPONSOR REALARCADE
            let adScroll = (distance * 1.2) % 240;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 85, canvas.width, 18);
            ctx.fillStyle = '#1e3799';
            ctx.fillRect(0, 85, canvas.width, 2);

            for (let adX = -adScroll; adX < canvas.width; adX += 240) {
                // Banner RealArcade
                ctx.fillStyle = '#0984e3';
                ctx.fillRect(adX + 10, 88, 90, 12);
                ctx.fillStyle = '#ffffff';
                ctx.font = '7px sans-serif';
                ctx.fillText("RealArcade", adX + 15, 97);

                // Banner zylom.com
                ctx.fillStyle = '#f1c40f';
                ctx.fillRect(adX + 115, 88, 100, 12);
                ctx.fillStyle = '#000000';
                ctx.fillText("www.zylom.com", adX + 120, 97);
            }

            // 4. PISTA D'ATLETICA BLU CON PERSPECTIVE INCLINATA
            ctx.fillStyle = '#4b6584'; // Bordo pista
            ctx.fillRect(0, 103, canvas.width, 5);

            ctx.fillStyle = '#2b580c'; // Sfondo erba bassa
            ctx.fillStyle = '#3c6382'; // Pista Blu Base
            ctx.fillRect(0, 108, canvas.width, 212);

            // Tonalità blu alternata per le corsie
            let laneY = [108, 140, 175, 215, 260];
            for (let i = 0; i < laneY.length - 1; i++) {
                ctx.fillStyle = (i % 2 === 0) ? '#3c6382' : '#0a3d62';
                ctx.fillRect(0, laneY[i], canvas.width, laneY[i+1] - laneY[i]);
            }

            // Corsie in Diagonale prospettica
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            let stripeOffset = (distance * 2) % 40;

            for (let lane of laneY) {
                ctx.beginPath();
                ctx.moveTo(0, lane);
                ctx.lineTo(canvas.width, lane);
                ctx.stroke();
            }

            // Linee Diagonali Bianchi di delimitazione
            ctx.lineWidth = 1.5;
            for (let x = -100 - stripeOffset; x < canvas.width + 100; x += 50) {
                ctx.beginPath();
                ctx.moveTo(x + 60, 108);
                ctx.lineTo(x, 280);
                ctx.stroke();
            }

            // Traguardo a Vento Diagonale
            let finishX = canvas.width - 60 - ((totalDistance - distance) * 0.8);
            if (finishX > -50 && finishX < canvas.width + 50) {
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(finishX + 80, 108);
                ctx.lineTo(finishX, 280);
                ctx.stroke();
            }

            // 5. ATLETI (Disegnati di trequarti come nello screenshot)
            // Avversaria donna in 2a corsia
            let botPosX = 90 + ((botDist - distance) * 0.8);
            drawRunner(botPosX, 135, '#e74c3c', '#000000', false);

            // PLAYMAN in 3a corsia (In primo piano)
            drawRunner(110, 165, '#e74c3c', '#d35400', true);

            // 6. INTERFACCIA HUD IN ALTO (Uguale allo screenshot)
            // Targa con Logo P e Nome Atleta
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.moveTo(10, 8);
            ctx.lineTo(130, 8);
            ctx.lineTo(120, 32);
            ctx.lineTo(10, 32);
            ctx.fill();

            // Logo P Bianco
            ctx.fillStyle = '#ffffff';
            ctx.font = 'italic bold 14px sans-serif';
            ctx.fillText("P", 18, 26);

            // Nome Atleta in Italico
            ctx.fillStyle = '#ffffff';
            ctx.font = 'italic bold 12px sans-serif';
            ctx.fillText(playerName, 42, 25);

            // Cronometro Badge Rosso in Alto a Destra
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.roundRect(canvas.width - 95, 8, 85, 28, 8);
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Testo Cronometro
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 13px monospace';
            ctx.fillText(timer.toFixed(2), canvas.width - 82, 27);
        }

        // DISEGNO DELLO SPRITE PLAYMAN DI TREQUARTI (Stile Playman 3)
        function drawRunner(x, y, shirtColor, hairColor, isPlayman) {
            if (x < -40 || x > canvas.width + 40) return;

            ctx.save();
            ctx.translate(Math.floor(x), Math.floor(y));

            let frame = Math.floor(animFrame) % 4;

            // Ombra sotto l'atleta
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(8, 38, 12, 4, 0, 0, Math.PI * 2);
            ctx.fill();

            // 1. Capelli a punta arancioni (Playman style)
            ctx.fillStyle = isPlayman ? '#e67e22' : '#2c3e50';
            ctx.beginPath();
            ctx.arc(8, 2, 7, 0, Math.PI * 2);
            ctx.fill();

            // Creste dei capelli per Playman
            if (isPlayman) {
                ctx.fillRect(0, -6, 4, 6);
                ctx.fillRect(5, -8, 4, 8);
                ctx.fillRect(10, -5, 4, 6);
            }

            // 2. Viso e Collo
            ctx.fillStyle = '#ffdd59';
            ctx.fillRect(4, 3, 8, 7);
            // Occhio
            ctx.fillStyle = '#000000';
            ctx.fillRect(9, 5, 2, 2);

            // 3. Canottiera Rossa e Striscia Bianca
            ctx.fillStyle = shirtColor;
            ctx.fillRect(2, 10, 10, 13);
            ctx.fillStyle = '#ffffff'; // Striscia bianca laterale
            ctx.fillRect(2, 10, 3, 13);

            // 4. Pantaloncini Neri
            ctx.fillStyle = '#111111';
            ctx.fillRect(2, 23, 10, 6);

            // 5. Braccia
            ctx.fillStyle = '#ffdd59';
            if (frame === 0 || frame === 2) {
                ctx.fillRect(-3, 11, 5, 9);
                ctx.fillRect(10, 13, 5, 8);
            } else {
                ctx.fillRect(-1, 13, 4, 8);
                ctx.fillRect(11, 10, 5, 9);
            }

            // 6. Gambe e Scarpe Dorate
            ctx.fillStyle = '#ffdd59'; // Pelle gambe
            if (running && speed > 5) {
                if (frame === 0) {
                    ctx.fillRect(-4, 28, 5, 7); // Gamba SX
                    ctx.fillRect(-8, 33, 6, 4); 
                    ctx.fillStyle = '#f1c40f'; // Scarpa
                    ctx.fillRect(-11, 33, 4, 4);

                    ctx.fillStyle = '#ffdd59';
                    ctx.fillRect(8, 28, 5, 8);  // Gamba DX
                    ctx.fillStyle = '#f1c40f';
                    ctx.fillRect(11, 34, 5, 4);
                } else if (frame === 1) {
                    ctx.fillRect(0, 28, 5, 9);
                    ctx.fillRect(6, 28, 5, 8);
                    ctx.fillStyle = '#f1c40f';
                    ctx.fillRect(7, 34, 5, 4);
                } else if (frame === 2) {
                    ctx.fillRect(8, 28, 5, 7);
                    ctx.fillRect(12, 33, 6, 4);
                    ctx.fillStyle = '#f1c40f';
                    ctx.fillRect(16, 33, 4, 4);

                    ctx.fillStyle = '#ffdd59';
                    ctx.fillRect(-2, 28, 5, 8);
                    ctx.fillStyle = '#f1c40f';
                    ctx.fillRect(-5, 34, 5, 4);
                } else {
                    ctx.fillRect(3, 28, 5, 9);
                    ctx.fillRect(-1, 28, 5, 8);
                    ctx.fillStyle = '#f1c40f';
                    ctx.fillRect(-2, 34, 5, 4);
                }
            } else {
                ctx.fillRect(2, 28, 4, 8);
                ctx.fillRect(7, 28, 4, 8);
                ctx.fillStyle = '#f1c40f';
                ctx.fillRect(1, 34, 5, 4);
                ctx.fillRect(6, 34, 5, 4);
            }

            ctx.restore();
        }

        function press(key) {
            if (finished || document.getElementById('menu-overlay').style.display !== 'none') return;

            if (!running) {
                running = true;
            }

            if (key !== lastKey) {
                speed = Math.min(195, speed + 29);
                lastKey = key;
            } else {
                speed = Math.max(0, speed - 40);
            }
        }

        document.getElementById('btnSX').addEventListener('touchstart', (e) => { e.preventDefault(); press('SX'); });
        document.getElementById('btnDX').addEventListener('touchstart', (e) => { e.preventDefault(); press('DX'); });
        document.getElementById('btnSX').addEventListener('click', () => press('SX'));
        document.getElementById('btnDX').addEventListener('click', () => press('DX'));

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
