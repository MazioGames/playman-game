<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Playman Summer Games</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0d0f12;
            color: white;
            font-family: 'Press Start 2P', monospace;
            overflow: hidden;
            user-select: none;
        }

        /* Contenitore Principale Fullscreen */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* MENU E OVERLAY RETRÒ */
        #menu-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, #1e3799, #0c2461);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
        }

        h1 {
            color: #f6b93b;
            font-size: 24px;
            margin: 0 0 5px 0;
            text-shadow: 3px 3px #b71540;
        }

        .subtitle {
            color: #78e08f;
            font-size: 10px;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        input[type="text"] {
            padding: 8px;
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            border-radius: 4px;
            border: 3px solid #f6b93b;
            text-align: center;
            width: 60%;
            max-width: 200px;
            background: #0c2461;
            color: #fff;
            margin-bottom: 12px;
        }

        .menu-btn {
            padding: 12px;
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            background: #e55039;
            color: white;
            border: 3px solid #fff;
            border-radius: 8px;
            box-shadow: 0 4px #b71540;
            margin: 5px;
            width: 70%;
            max-width: 220px;
            touch-action: manipulation;
        }

        .menu-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px #b71540;
        }

        .high-score-box {
            margin-top: 10px;
            padding: 8px;
            background: rgba(0, 0, 0, 0.4);
            border: 2px dashed #f6b93b;
            font-size: 8px;
            color: #f6b93b;
            line-height: 1.5;
        }

        /* HUD GIOCO SUPERIORE */
        #game-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 6px 15px;
            background: rgba(12, 36, 97, 0.85);
            border-bottom: 2px solid #f6b93b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .hud-text {
            font-size: 10px;
        }

        /* CANVAS FLUIDO RISPETTO ALLO SCHERMO */
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            image-rendering: pixelated;
        }

        /* TASTI TOUCH LATERALI PER POLLICI */
        .touch-btn {
            position: absolute;
            bottom: 15px;
            width: 120px;
            height: 80px;
            font-family: 'Press Start 2P', monospace;
            font-size: 14px;
            background: linear-gradient(180deg, rgba(250, 152, 58, 0.8), rgba(229, 80, 57, 0.8));
            color: white;
            border: 3px solid #fff;
            border-radius: 15px;
            box-shadow: 0 4px #b71540;
            touch-action: manipulation;
            z-index: 15;
        }

        #btnSX { left: 20px; }
        #btnDX { right: 20px; }

        .touch-btn:active {
            transform: translateY(3px);
            background: rgba(229, 80, 57, 0.95);
        }

        /* FINISH POPUP */
        #end-game-modal {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #0c2461;
            border: 4px solid #f6b93b;
            padding: 15px;
            border-radius: 12px;
            z-index: 25;
            width: 70%;
            max-width: 280px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- MENU PRINCIPALE -->
        <div id="menu-overlay">
            <h1>PLAYMAN</h1>
            <div class="subtitle">SUMMER GAMES</div>

            <input type="text" id="playerName" placeholder="NOME" maxlength="8" value="PLAYMAN">

            <button class="menu-btn" onclick="startGame()">🏃 100M SPRINT</button>

            <div class="high-score-box">
                BEST RECORD:<br>
                <span id="recordDisplay">--.--s</span>
            </div>
        </div>

        <!-- HUD -->
        <div id="game-header">
            <div class="hud-text" id="status" style="color: #f6b93b;">ALTERNA SX E DX!</div>
            <div class="hud-text" id="timer">TEMPO: 0.00s</div>
        </div>

        <!-- CANVAS Fullscreen -->
        <canvas id="gameCanvas"></canvas>

        <!-- CONTROLLI AI LATI DELLO SCHERMO -->
        <button class="touch-btn" id="btnSX">👈 SX</button>
        <button class="touch-btn" id="btnDX">DX 👉</button>

        <!-- POPUP FINISH -->
        <div id="end-game-modal">
            <h2 id="endTitle" style="color: #78e08f; font-size: 12px; margin-top:0;">GARA FINITA!</h2>
            <p id="endDetails" style="font-size: 9px; line-height: 1.5;"></p>
            <button class="menu-btn" style="width:100%; margin:4px 0;" onclick="restartGame()">RIGIOCA</button>
            <button class="menu-btn" style="width:100%; margin:4px 0; background:#6a89cc;" onclick="showMenu()">MENU</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let distance = 0;
        let speed = 0;
        let lastKey = '';
        let timer = 0;
        let running = false;
        let finished = false;
        let animFrame = 0;
        let totalDistance = 600;

        // BOT Avversari
        let bot1Speed = 110;
        let bot2Speed = 100;
        let bot1Dist = 0;
        let bot2Dist = 0;

        let playerName = "PLAYMAN";
        let bestRecord = localStorage.getItem('playman_best') ? parseFloat(localStorage.getItem('playman_best')) : null;
        let bestPlayer = localStorage.getItem('playman_player') || "";

        const statusText = document.getElementById('status');
        const timerText = document.getElementById('timer');
        const recordDisplay = document.getElementById('recordDisplay');

        function updateRecordDisplay() {
            if (bestRecord) {
                recordDisplay.innerText = `${bestPlayer}: ${bestRecord.toFixed(2)}s`;
            } else {
                recordDisplay.innerText = "NESSUN RECORD";
            }
        }
        updateRecordDisplay();

        function startGame() {
            let inputName = document.getElementById('playerName').value.trim();
            if (inputName !== "") playerName = inputName.toUpperCase();
            
            document.getElementById('menu-overlay').style.display = 'none';
            document.getElementById('end-game-modal').style.display = 'none';

            resetVariables();
        }

        function showMenu() {
            document.getElementById('end-game-modal').style.display = 'none';
            document.getElementById('menu-overlay').style.display = 'flex';
            updateRecordDisplay();
        }

        function restartGame() {
            document.getElementById('end-game-modal').style.display = 'none';
            resetVariables();
        }

        function resetVariables() {
            distance = 0;
            speed = 0;
            lastKey = '';
            timer = 0;
            running = false;
            finished = false;
            animFrame = 0;
            bot1Dist = 0;
            bot2Dist = 0;
            bot1Speed = 110 + Math.random() * 15;
            bot2Speed = 100 + Math.random() * 20;
            statusText.innerText = "PRONTI... VIA!";
            statusText.style.color = "#f6b93b";
            timerText.innerText = "TEMPO: 0.00s";
        }

        let lastTime = performance.now();
        function gameLoop(currentTime) {
            let delta = (currentTime - lastTime) / 1000;
            lastTime = currentTime;

            if (running && !finished) {
                timer += delta;
                timerText.innerText = 'TEMPO: ' + timer.toFixed(2) + 's';

                speed = Math.max(0, speed - (55 * delta));
                distance += speed * delta;
                animFrame += speed * delta * 0.18;

                bot1Dist += bot1Speed * delta;
                bot2Dist += bot2Speed * delta;

                if (distance >= totalDistance) {
                    finished = true;
                    handleFinish();
                }
            }

            drawScene();
            requestAnimationFrame(gameLoop);
        }

        function handleFinish() {
            let finalTime = timer.toFixed(2);
            let isNewRecord = false;

            if (!bestRecord || timer < bestRecord) {
                bestRecord = timer;
                bestPlayer = playerName;
                localStorage.setItem('playman_best', bestRecord);
                localStorage.setItem('playman_player', bestPlayer);
                isNewRecord = true;
            }

            document.getElementById('endTitle').innerText = isNewRecord ? "🏆 NUOVO RECORD!" : "GARA FINITA!";
            document.getElementById('endTitle').style.color = isNewRecord ? "#f6b93b" : "#78e08f";
            document.getElementById('endDetails').innerText = `${playerName}\nTEMPO: ${finalTime}s`;
            document.getElementById('end-game-modal').style.display = 'block';
        }

        function drawScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. SPALTI E PUBBLICO
            let crowdHeight = canvas.height * 0.22;
            ctx.fillStyle = '#1e3799';
            ctx.fillRect(0, 0, canvas.width, crowdHeight);

            for (let x = 0; x < canvas.width; x += 10) {
                for (let y = 10; y < crowdHeight - 10; y += 10) {
                    let colors = ['#f6b93b', '#e55039', '#ffffff', '#78e08f', '#4a69bd'];
                    ctx.fillStyle = colors[(x + y + Math.floor(animFrame)) % colors.length];
                    ctx.fillRect(x, y, 6, 6);
                }
            }

            // Cartelloni Pubblicitari
            let adHeight = 20;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, crowdHeight, canvas.width, adHeight);
            ctx.fillStyle = '#b71540';
            ctx.font = '10px monospace';
            ctx.fillText("PLAYMAN SUMMER GAMES  -  WORLD CHAMPIONSHIP", -((distance * 1.5) % 300) + 50, crowdHeight + 14);

            // 2. PISTA D'ATLETICA
            let trackTop = crowdHeight + adHeight;
            let trackHeight = canvas.height - trackTop;
            let laneHeight = trackHeight / 3;

            ctx.fillStyle = '#b71540';
            ctx.fillRect(0, trackTop, canvas.width, trackHeight);

            // Righe di corsia
            ctx.fillStyle = '#ffffff';
            for (let i = 0; i <= 3; i++) {
                ctx.fillRect(0, trackTop + (i * laneHeight), canvas.width, 3);
            }

            // Righe rosse alternate di scorrimento pista
            ctx.fillStyle = '#e55039';
            let scrollX = (distance * 2) % 40;
            for (let x = -scrollX; x < canvas.width; x += 40) {
                ctx.fillRect(x, trackTop + 3, 20, laneHeight - 3);
                ctx.fillRect(x + 20, trackTop + laneHeight + 3, 20, laneHeight - 3);
                ctx.fillRect(x, trackTop + (laneHeight * 2) + 3, 20, laneHeight - 3);
            }

            // Traguardo a scacchi
            let finishX = canvas.width - 150 - ((totalDistance - distance) * 0.8);
            if (finishX > -30 && finishX < canvas.width + 30) {
                for (let y = trackTop; y < canvas.height; y += 12) {
                    ctx.fillStyle = ((y / 12) % 2 === 0) ? '#ffffff' : '#000000';
                    ctx.fillRect(finishX, y, 12, 12);
                }
            }

            // 3. ATLETI IN CORSA
            let playerX = canvas.width * 0.25;

            // Corsia 1 (Bot 1)
            let bot1PosX = playerX + ((bot1Dist - distance) * 0.8);
            drawAthlete(bot1PosX, trackTop + (laneHeight * 0.3), '#e55039', '#4a69bd', false);

            // Corsia 2 (PLAYMAN)
            drawAthlete(playerX, trackTop + (laneHeight * 1.3), '#0a3d62', '#f6b93b', true);

            // Corsia 3 (Bot 2)
            let bot2PosX = playerX + ((bot2Dist - distance) * 0.8);
            drawAthlete(bot2PosX, trackTop + (laneHeight * 2.3), '#78e08f', '#1e3799', false);
        }

        // SPRITE ATLETA (Scala dinamica in base all'altezza schermo)
        function drawAthlete(x, y, shirtColor, hairColor, isPlayman) {
            if (x < -40 || x > canvas.width + 40) return;

            ctx.save();
            ctx.translate(Math.floor(x), Math.floor(y));

            let frame = Math.floor(animFrame) % 4;

            // Capelli e Visiera
            ctx.fillStyle = hairColor;
            ctx.fillRect(4, 0, 16, 10);

            if (isPlayman) {
                ctx.fillStyle = '#e55039'; // Visiera Playman
                ctx.fillRect(0, 6, 20, 4);
            }

            // Viso
            ctx.fillStyle = '#ffdd59';
            ctx.fillRect(6, 6, 12, 10);

            // Corpo
            ctx.fillStyle = shirtColor;
            ctx.fillRect(4, 16, 16, 18);

            // Numero di gara
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(9, 20, 6, 9);

            // Pantaloncini
            ctx.fillStyle = '#0c2461';
            ctx.fillRect(4, 34, 16, 8);

            // Gambe
            ctx.fillStyle = '#ffdd59';
            if (running && speed > 5) {
                if (frame === 0) {
                    ctx.fillRect(-2, 42, 6, 14);
                    ctx.fillRect(12, 42, 6, 10);
                } else if (frame === 1) {
                    ctx.fillRect(4, 42, 6, 16);
                    ctx.fillRect(8, 42, 6, 8);
                } else if (frame === 2) {
                    ctx.fillRect(12, 42, 6, 14);
                    ctx.fillRect(-2, 42, 6, 10);
                } else {
                    ctx.fillRect(8, 42, 6, 16);
                    ctx.fillRect(4, 42, 6, 8);
                }
            } else {
                ctx.fillRect(4, 42, 5, 14);
                ctx.fillRect(11, 42, 5, 14);
            }

            ctx.restore();
        }

        function press(key) {
            if (finished || document.getElementById('menu-overlay').style.display !== 'none') return;

            if (!running) {
                running = true;
                statusText.innerText = "CORRI!";
                statusText.style.color = "#78e08f";
            }

            if (key !== lastKey) {
                speed = Math.min(210, speed + 32);
                lastKey = key;
                statusText.innerText = "RITMO PERFETTO!";
                statusText.style.color = "#78e08f";
            } else {
                speed = Math.max(0, speed - 45);
                statusText.innerText = "RITMO ERRATO!";
                statusText.style.color = "#e55039";
            }
        }

        document.getElementById('btnSX').addEventListener('touchstart', (e) => { e.preventDefault(); press('SX'); });
        document.getElementById('btnDX').addEventListener('touchstart', (e) => { e.preventDefault(); press('DX'); });
        document.getElementById('btnSX').addEventListener('click', () => press('SX'));
        document.getElementById('btnDX').addEventListener('click', () => press('DX'));

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
